[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "veyviz-inference-onnxruntime"
version = "0.1.0a1"
description = "Verified local ONNX CPU execution behind the tensor port"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["veyviz-execution-contracts==0.1.0a1", "veyviz-process-supervision==0.1.0a1", "numpy==2.3.5", "onnxruntime==1.23.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/veyviz_inference_onnxruntime"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/veyviz_inference_onnxruntime"]

[tool.veyviz.package]
import-name = "veyviz_inference_onnxruntime"
allowed-external-imports = ["veyviz_execution_contracts", "veyviz_process_supervision", "numpy", "onnxruntime"]
allow-dynamic-imports = false
minimum-statements = 100.0
minimum-branches = 100.0

[tool.coverage.run]
branch = true
source = ["veyviz_inference_onnxruntime"]

[tool.coverage.report]
show_missing = true
precision = 2

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
