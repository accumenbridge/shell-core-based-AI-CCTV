[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "veyviz-model-rfdetr"
version = "0.1.0a1"
description = "Exact RF-DETR-small person preprocessing and semantic decoding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["veyviz-execution-contracts==0.1.0a1", "veyviz-media-contracts==0.1.0a1", "veyviz-perception-contracts==0.1.0a1", "numpy==2.3.5", "opencv-python-headless==5.0.0.93"]

[tool.hatch.build.targets.wheel]
packages = ["src/veyviz_model_rfdetr"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/PROVENANCE.md", "/pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/veyviz_model_rfdetr"]

[tool.veyviz.package]
import-name = "veyviz_model_rfdetr"
allowed-external-imports = ["veyviz_execution_contracts", "veyviz_media_contracts", "veyviz_perception_contracts", "numpy", "cv2"]
allow-dynamic-imports = false
minimum-statements = 100.0
minimum-branches = 100.0

[tool.coverage.run]
branch = true
source = ["veyviz_model_rfdetr"]

[tool.coverage.report]
show_missing = true
precision = 2
