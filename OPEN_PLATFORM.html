function render(){
 const views={overview:home,composer,modules,desk,knowledge,handoff:flow,architecture,build:buildView};
 root.innerHTML=`<div class="layout"><aside class="sidebar" id="sidebar"><a class="brand" href="#/overview"><span class="brand-mark">Q</span><span class="brand-name">Quadbridge<small>Product Platform</small></span></a><div class="nav-section">BUILD</div>${navs.slice(0,5).map(([id,i,t])=>`<button type="button" class="nav-button ${state.route===id?'active':''}" data-action="go:${id}" ${state.route===id?'aria-current="page"':''}>${icon(i,16)}${t}${id==='modules'?`<span class="nav-count">${data.modules.length}</span>`:''}</button>`).join('')}<div class="nav-section">EXPLORE SAMPLE SCREENS</div>${navs.slice(5).map(([id,i,t])=>`<button type="button" class="nav-button ${state.route===id?'active':''}" data-action="go:${id}" ${state.route===id?'aria-current="page"':''}>${icon(i,16)}${t}</button>`).join('')}<div class="sidebar-foot"><div class="version-row"><span class="status-dot"></span>Foundation 0.2 · Studio integration 1</div><p>Local framework tools.<br>No production connection.</p><a class="doc-link" href="DOCUMENTATION.html">${icon('book',13)} Documentation ${icon('external',11)}</a></div></aside><main class="main"><header class="topbar"><div style="display:flex;gap:11px;align-items:center">${btn(icon('menu',17),'menu','quiet menu-toggle','aria-label="Toggle navigation"')}<div class="breadcrumb"><span>Workspace</span>${icon('chevron',12)}<strong>${esc(names[state.route])}</strong></div></div><div class="top-actions"><span class="mode-badge">${globalThis.QB_STUDIO_MODE?(state.paired?'LOCAL STUDIO · PAIRED':'LOCAL STUDIO · PAIR REQUIRED'):'OFFLINE INTERACTIVE PREVIEW'}</span>${btn(`${icon('play',12)} ${globalThis.QB_STUDIO_MODE?'Connect local Studio':'Run real apps'}`,'run','')}<span class="avatar" aria-label="Preview identity, not signed in">QB</span></div></header><div class="preview-strip">${icon('info',12)}<strong>${globalThis.QB_STUDIO_MODE?'Local builder.':'Preview mode.'}</strong><span>Sample records and simulations stay in this page. Refresh resets them. ${globalThis.QB_STUDIO_MODE?'Paired build/run actions use the actual local factory.':'Start npm run studio for the actual local builder.'}</span></div><div class="canvas">${(views[state.route]||home)()}<footer class="footnote">${icon('layers',12)} Maintained shells · selected modules · explicit ownership</footer></div></main></div>`;
}
function go(route){if(!names[route])route='overview';state.route=route;state.search='';location.hash=`/${route}`;render();window.scrollTo?.({top:0});const h=document.querySelector?.('h1');h?.setAttribute('tabindex','-1');h?.focus({preventScroll:true});}
function toast(message){clearTimeout(toastTimer);document.getElementById('toast')?.remove();const d=document.createElement('div');d.id='toast';d.className='toast';d.setAttribute('role','status');d.textContent=message;document.body.append(d);toastTimer=setTimeout(()=>d.remove(),4200);}
function openModal(title,body){closeModal();lastFocus=document.activeElement;const overlay=document.createElement('div');overlay.id='modal';overlay.className='modal-backdrop';overlay.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${esc(title)}</h2>${btn(icon('x',18),'close','quiet','aria-label="Close dialog"')}</div>${body}</section>`;document.body.append(overlay);overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});overlay.querySelector('input,select,textarea,button')?.focus();}
function closeModal(){document.getElementById('modal')?.remove();if(lastFocus?.isConnected)lastFocus.focus();}
function runModal(product){
 if(globalThis.QB_STUDIO_MODE){state.buildProduct=product||state.buildProduct;if(state.paired){closeModal();return go('build');}return openModal('Connect to your local Studio',`<p>Enter the pairing code printed by <code>npm run studio</code>. This authorizes local definition, build and launch actions only.</p><form id="pair-studio"><label class="form-label" for="pair-code">Terminal pairing code</label><input class="input" id="pair-code" name="code" required autocomplete="off" maxlength="100"><div class="actions"><button type="submit" class="btn primary">Pair this browser</button></div></form>`);}
 openModal('Open the actual local builder',`<p>This offline page cannot write source, build applications or start processes.</p><p>Extract the complete folder and run:</p><pre class="code-panel">npm run setup\nnpm run studio</pre><p>Or double-click <strong>START_STUDIO.cmd</strong> on Windows. Open the address printed in the terminal and enter its pairing code.</p><a class="port-link" href="http://127.0.0.1:4390" target="_blank" rel="noopener">Open local Studio ${icon('external',14)}</a><p class="help">This link does not start or inspect servers. The included compiled Studio needs no package download. New source builds require the pinned tools.</p>`);
}
async function studioApi(path,method='GET',payload){
 if(!globalThis.QB_STUDIO_MODE)throw Error('Open the opt-in local Studio first. Offline preview makes no API calls.');
 const response=await fetch('/studio-api'+path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},...(payload===undefined?{}:{body:JSON.stringify(payload)}),signal:AbortSignal.timeout(25000)});
 const result=await response.json();if(!response.ok){if(response.status===401)state.paired=false;throw Error(result.error||'Studio operation failed');}return result;
}
async function refreshStudio(redraw=true){if(!state.paired)return;const [catalogue,status]=await Promise.all([studioApi('/catalogue'),studioApi('/status')]);const signature=JSON.stringify([catalogue,status]);const changed=signature!==state.lastStatus;if(state.lastStatus&&changed){state.definitionGeneration++;state.definitionInspection=null;state.definitionDiagnostics=['The source catalogue changed. Preview the retained definition again.'];}state.lastStatus=signature;data=catalogue;catalogueMetadata();state.runtime=status;if(redraw&&changed)render();}
function reportError(e){state.busy=false;toast(e.message||String(e));if(state.route==='build')render();}
function productModal(id){const p=data.products.find(p=>p.id===id);if(!p)return;let plan,error;try{plan=globalThis.QBComposition.resolve(p,data.modules);}catch(e){error=e.message;}openModal(p.title,`<p>${esc(p.description||'Registered product')}</p>${pill(plan?'Definition resolves':'Needs attention',plan?'green':'amber')}<div class="state-list">${(plan?.modules||[]).map(m=>`<div class="state-item"><strong>${esc(moduleMeta[m.id].title)}</strong><p>${esc(m.version)} · ${m.workspaces.length} workspaces</p></div>`).join('')||'<p>No business modules selected.</p>'}</div>${error?`<p class="composition-error">${esc(error)}</p>`:''}<p class="help">A registered definition is not a running instance.</p><div class="actions">${btn('Inspect architecture',`arch-product:${p.id}`)}${btn('Build / run',`run:${p.id}`,'primary')}</div>`);}
function download(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function viewRecord(kind,id){const row=(kind==='request'?state.requests:state.docs).find(x=>x.id===id);if(!row)return;openModal(row.title,`${pill('Sample data · in-memory only',kind==='document'?'purple':'blue')}<p style="margin:19px 0;white-space:pre-wrap">${esc(row.details||row.body)}</p><div class="code-path">${esc(row.id)}</div><div class="actions">${kind==='request'&&row.state==='OPEN'?btn('Close sample request',`close-request:${id}`,'primary'):kind==='document'?btn('Explore a cross-product handoff','view-flow','primary'):btn('Close','close')}</div>`);}
function nextFlow(lost=false){if(state.flowStep===0){state.flowStep=1;state.flowKey=uid('sample-command');}else if(state.flowStep===1){state.flowStep=2;state.flowUncertain=lost;if(!state.flowCommitted){state.flowCommitted=true;state.flowRecord=uid('SAMPLE-REQ');state.requests.unshift({id:state.flowRecord,title:'Review linked knowledge procedure',details:'Created by the visual handoff simulation. This is not a server record.',state:'OPEN',source:'Preview handoff'});}}render();}
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;const [key,...args]=action.split(':');const arg=args.join(':');
 if(key==='family-derive'){
  const family=(data.families||[]).find(item=>item.id===state.familyBuilder.familyId);
  try{if(!family)throw Error('Choose a reviewed product family.');state.familyResult=globalThis.QBFamilies.deriveFamily(family,state.familyBuilder.selection,{id:state.familyBuilder.id,title:state.familyBuilder.title,version:state.familyBuilder.version,description:state.familyBuilder.description,layout:state.familyBuilder.layout},data.modules,data.solutions||[]);state.familyError='';}
  catch(error){state.familyResult=null;state.familyError=error instanceof Error?error.message:'Family composition is unavailable.';}
  return render();
 }
 if(key==='family-load-editor'){if(!state.familyResult)return;setDefinitionText(JSON.stringify(state.familyResult.product,null,2)+'\n');render();return;}
 if(key==='family-export'){if(!state.familyResult)return;const product=state.familyResult.product;download(`${product.id}.product.json`,JSON.stringify(product,null,2)+'\n');toast('Product definition exported. No application was saved or started.');return;}
 if(key==='product')return productModal(arg);
 if(key==='arch-product'){closeModal();state.archProduct=arg;return go('architecture');}
 if(key==='refresh-studio'){if(!state.paired)return runModal();void refreshStudio().catch(reportError);return;}
 if(key==='save-source'){
  state.pendingSourceProduct=null;
  if(!globalThis.QB_STUDIO_MODE||!state.paired)return runModal();
  let p;try{p=builderProduct();}catch(e){return reportError(e);}
  openModal('Create this product definition?',`<p>Write <strong>products/${esc(p.id)}/product.json</strong> in this local checkout. Existing products are never replaced. This does not grant access or start a server.</p><div class="actions">${btn('Cancel','close')}${btn('Create local source','confirm-source','primary')}</div>`);return;
 }
 if(key==='confirm-source'){if(state.busy)return;const product=state.pendingSourceProduct||builderProduct();state.pendingSourceProduct=null;state.busy=true;void (async()=>{const result=await studioApi('/products','POST',product);state.buildProduct=result.product.id;closeModal();await refreshStudio(false);state.busy=false;go('build');toast('Source saved. Build and launch are separate actions.');})().catch(reportError);return;}
 if(['build-product','launch-product','stop-product'].includes(key)){
  if(!state.paired)return runModal();const id=state.buildProduct||data.products[0]?.id;if(!id)return;
  const operation={'build-product':'build','launch-product':'launch','stop-product':'stop'}[key];
  openModal(`${operation==='build'?'Build source':operation==='launch'?'Start local application':'Stop managed application'}?`,`<p>${operation==='build'?'Run the fixed compiler/build and export commands against reviewed local source. No package installation is automatic.':operation==='launch'?'Start the exact compiled snapshot on loopback with the reviewed local fixture identities. A changed snapshot receives separate data.':'Stop only the process tree owned by this Studio. Local records are retained.'}</p><div class="code-path">${esc(id)}</div><div class="actions">${btn('Cancel','close')}${btn('Confirm',`confirm-operation:${operation}:${id}`,'primary')}</div>`);return;
 }
 if(key==='confirm-operation'){if(state.busy)return;const [operation,id]=args;state.busy=true;closeModal();void (async()=>{await studioApi(`/products/${id}/${operation}`,'POST',{confirm:true});state.busy=false;await refreshStudio();toast(operation==='build'?'Build accepted. Follow actual progress below.':operation==='launch'?'Local API ready. Open the application and verify your workflow.':'Instance stopped.');})().catch(reportError);return;}
 if(key==='go')return go(arg);
 if(key==='menu')return document.getElementById('sidebar').classList.toggle('open');
 if(key==='run')return runModal(arg||undefined);
 if(key==='close'){state.pendingSourceProduct=null;return closeModal();}
 if(key==='library'){state.library=arg;return render();}
 if(key==='node'){state.activeNode=arg;return render();}
 if(key==='inspect'){if(arg.startsWith('module:')){const id=arg.slice(7),m=moduleMeta[id],manifest=data.modules.find(x=>x.id===id);openModal(m.title,`<p>${esc(m.description)}</p>${pill('Actual source manifest','blue')}<div class="code-path">${esc(m.path)}module.json</div><div class="state-list"><div class="state-item"><small>Frontend contributions</small><strong>${manifest.workspaces.length} declared workspaces</strong></div><div class="state-item"><small>Public operations</small><strong>${manifest.routes.length} declared API routes</strong></div></div><details><summary class="small-muted" style="cursor:pointer;margin-top:16px">Inspect declared manifest</summary><pre class="code-panel">${esc(JSON.stringify(manifest,null,2))}</pre></details>`);}else{state.activeNode=arg;go('architecture');}return;}
 if(key==='export'){try{const p=builderProduct();download(`${p.id}.product.json`,JSON.stringify(p,null,2)+'\n');toast('Product definition exported. No application was deployed.');}catch(e){toast(e.message);}return;}
 if(key==='definition-starter'){setDefinitionText(JSON.stringify(builderProduct(),null,2)+'\n');render();return;}
 if(key==='definition-preview'){const result=globalThis.QBComposer.parseProductDefinition(state.definitionText,data.modules,data.solutions||[]);state.definitionInspection=result;state.definitionDiagnostics=result.diagnostics||[];render();return;}
 if(key==='definition-load'){const select=document.querySelector('[data-definition-saved]'),index=Number(select?.value);if(!Number.isInteger(index)||!data.products[index])return;setDefinitionText(JSON.stringify(data.products[index],null,2)+'\n');render();return;}
 if(key==='definition-export'){if(!state.definitionInspection?.valid)return;try{const p=state.definitionInspection.product,text=globalThis.QBComposer.serializeProductDefinition(p,data.modules,data.solutions||[]);download(`${p.id}.product.json`,text);toast('Validated product definition exported.');}catch(e){toast(e.message);}return;}
 if(key==='definition-save-source'){if(!state.paired||!state.definitionInspection?.valid)return;const product=state.definitionInspection.product;state.pendingSourceProduct=product;openModal('Save this immutable definition?',`<p>Write <strong>products/${esc(product.id)}/product.json</strong> in this paired local checkout. Existing product versions are never replaced; choose a new version to make a distinct definition.</p><div class="code-path">${esc(product.id)}@${esc(product.version)}</div><div class="actions">${btn('Cancel','close')}${btn('Save exact version','confirm-source','primary')}</div>`);return;}
 if(key==='save-draft'){try{const p=state.definitionInspection?.valid?state.definitionInspection.product:builderProduct();const found=state.drafts.findIndex(x=>x.id===p.id&&x.version===p.version);if(found>=0)state.drafts[found]=p;else state.drafts.push(p);toast('Preview draft saved for this page session.');}catch(e){toast(e.message);}return;}
 if(key==='draft'){const p=state.drafts[Number(arg)];if(p)download(`${p.id}.product.json`,JSON.stringify(p,null,2)+'\n');return;}
 if(key==='filter'){state.filter=arg;return render();}
 if(key==='request'||key==='document')return viewRecord(key,arg);
 if(key==='close-request'){const row=state.requests.find(x=>x.id===arg);if(row)row.state='CLOSED';closeModal();render();toast('Sample request closed. No backend record changed.');return;}
 if(key==='new-request'){openModal('New sample service request',`<p>This form changes only the visual preview. Use the real app for persisted requests.</p><form id="sample-request"><label class="form-label" for="sample-title">Title</label><input class="input" id="sample-title" name="title" required maxlength="120"><label class="form-label" for="sample-details">Details</label><textarea class="input" id="sample-details" name="details" required maxlength="3000" rows="4"></textarea><div class="actions"><button type="submit" class="btn primary">Create sample request</button></div></form>`);return;}
 if(key==='new-document'){openModal('Add sample text',`<p>Preview-only text. The real application persists documents and runs indexing in a separate worker.</p><form id="sample-document"><label class="form-label" for="sample-title">Title</label><input class="input" id="sample-title" name="title" required maxlength="120"><label class="form-label" for="sample-body">Document text</label><textarea class="input" id="sample-body" name="body" required maxlength="8000" rows="5"></textarea><div class="actions"><button type="submit" class="btn primary">Add to sample library</button></div></form>`);return;}
 if(key==='view-flow'){closeModal();return go('handoff');}
 if(key==='flow-next')return nextFlow();
 if(key==='flow-lost')return nextFlow(true);
 if(key==='flow-check'){if(state.flowCommitted){state.flowUncertain=false;render();toast('Simulation: original receipt confirmed. No second request created.');}return;}
 if(key==='reset-flow'){state.flowStep=0;state.flowUncertain=false;state.flowCommitted=false;state.flowKey=null;state.flowRecord=null;render();return;}
});
document.addEventListener('submit',e=>{if(e.target.id==='pair-studio'){e.preventDefault();const form=new FormData(e.target);void studioApi('/session','POST',{code:String(form.get('code'))}).then(async()=>{state.paired=true;closeModal();await refreshStudio();go('build');}).catch(reportError);return;}if(e.target.id==='sample-request'){e.preventDefault();const form=new FormData(e.target);state.requests.unshift({id:uid('SAMPLE-REQ'),title:String(form.get('title')).trim(),details:String(form.get('details')).trim(),state:'OPEN',source:'Preview form'});closeModal();render();toast('Sample request added to this page.');}if(e.target.id==='sample-document'){e.preventDefault();const form=new FormData(e.target);state.docs.unshift({id:uid('SAMPLE-DOC'),title:String(form.get('title')).trim(),body:String(form.get('body')).trim(),kind:'Sample text',state:'READY'});closeModal();render();toast('Sample text added. No server indexing was performed.');}});
document.addEventListener('change',e=>{const el=e.target;if(el?.matches?.('[data-family-id]')){const previous=(data.families||[]).find(item=>item.id===state.familyBuilder.familyId);const next=(data.families||[]).find(item=>item.id===el.value);if(!next)return;state.familyBuilder.familyId=next.id;state.familyBuilder.selection=[...(next.defaultFeatureIds||[])];if(state.familyBuilder.title===previous?.title)state.familyBuilder.title=next.title;state.familyResult=null;state.familyError='';return render();}if(el?.matches?.('[data-family-feature]')){state.familyBuilder.selection=[...document.querySelectorAll('.family-builder [data-family-feature]:checked')].map(item=>item.dataset.familyFeature);state.familyResult=null;state.familyError='';return render();}});
document.addEventListener('input',e=>{const el=e.target;if(!el?.matches?.('[data-family-field]'))return;const field=el.dataset.familyField;if(!['id','title','version','description'].includes(field))return;state.familyBuilder[field]=el.value;state.familyResult=null;state.familyError='';const panel=el.closest('.family-builder');panel?.querySelector('.family-result')?.remove();panel?.querySelector('[data-action="family-load-editor"]')?.remove();panel?.querySelector('[data-action="family-export"]')?.remove();panel?.querySelector('.composition-error[role="status"]')?.remove();});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.archProduct!==undefined){state.archProduct=el.value;return render();}if(el.dataset.buildProduct!==undefined){state.buildProduct=el.value;return render();}if(el.dataset.binding){state.builder.choices[el.dataset.binding]=el.value;return render();}if(el.dataset.field){state.builder[el.dataset.field]=el.value;if(el.dataset.field==='layout')render();else updateBuilderText();}if(el.dataset.module){const id=el.dataset.module;const chosen=new Set(state.builder.selected);if(el.checked)chosen.add(id);else chosen.delete(id);state.builder.selected=[...chosen];state.builder.choices={};render();}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches?.('[data-definition-import]')){const file=el.files?.[0];el.value='';if(!file)return;const generation=++state.definitionGeneration;state.definitionInspection=null;state.definitionDiagnostics=[];render();if(file.size>globalThis.QBComposer.STUDIO_PRODUCT_TEXT_LIMIT){state.definitionDiagnostics=['Product JSON must be at most 64 KiB.'];render();return;}void file.text().then(text=>{if(generation!==state.definitionGeneration)return;setDefinitionText(text);render();}).catch(()=>{if(generation===state.definitionGeneration){state.definitionInspection=null;state.definitionDiagnostics=['The selected product file could not be read.'];render();}});return;}if(el.matches?.('[data-definition-saved]'))state.definitionSavedIndex=el.value;});
function updateBuilderText(){const title=document.querySelector('.built-side strong');if(title)title.textContent=state.builder.title;let product,error;try{product=builderProduct();}catch(e){error=e.message;}const code=document.querySelector('.composer-grid .code-panel');if(code)code.textContent=error||JSON.stringify(product,null,2);const err=document.getElementById('composition-error');if(err)err.textContent=error||'';for(const button of document.querySelectorAll('[data-action="export"],[data-action="save-source"]'))button.disabled=!!error;}
document.addEventListener('input',e=>{const el=e.target;if(el.matches?.('[data-definition-json]')){const start=el.selectionStart,end=el.selectionEnd;setDefinitionText(el.value);render();const next=document.querySelector('[data-definition-json]');next?.focus();next?.setSelectionRange(start,end);}if(el.dataset.field){state.builder[el.dataset.field]=el.value;updateBuilderText();}if(el.dataset.search){const pos=el.selectionStart;state.search=el.value;const id=el.id;render();const replacement=document.getElementById(id);replacement?.focus();replacement?.setSelectionRange(pos,pos);}});
document.addEventListener('keydown',e=>{const m=document.getElementById('modal');if(!m)return;if(e.key==='Escape'){e.preventDefault();closeModal();}if(e.key==='Tab'){const els=[...m.querySelectorAll('a[href],button:not(:disabled),input,textarea,select,summary')];if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('hashchange',()=>{const id=location.hash.replace(/^#\/?/,'');if(names[id]&&id!==state.route){state.route=id;state.search='';render();}});
if(globalThis.QB_STUDIO_MODE){void studioApi('/status').then(async()=>{state.paired=true;await refreshStudio();}).catch(()=>{});setInterval(()=>{if(state.paired)void refreshStudio(state.route==='build'&&!document.getElementById('modal')&&!state.busy).catch(()=>{});},2000);}
const first=location.hash.replace(/^#\/?/,'');if(names[first])state.route=first;
render();
})();
</script></body></html>
