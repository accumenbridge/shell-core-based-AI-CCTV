plugins {
    id 'com.android.library'
}

android {
    namespace 'com.quadbridge.nativesession'
    compileSdk 36

    defaultConfig {
        minSdk 24
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':capacitor-android')
}
